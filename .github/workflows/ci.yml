name: GardenLiminal CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo test
        run: cargo test --lib --tests --no-fail-fast

      - name: Benchmark target smoke build
        run: cargo bench --bench manifest_and_events --no-run

      - name: Record capability validation environment
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/capability-enforcement
          {
            echo "source_sha=$SOURCE_SHA"
            echo "workflow_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            uname -a
            rustc --version
            cargo --version
            echo "cap_last_cap=$(cat /proc/sys/kernel/cap_last_cap)"
            cat /etc/os-release
          } | tee artifacts/capability-enforcement/environment.txt

      - name: Privileged capability enforcement + execve smoke
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" "HOME=$HOME" \
            cargo test --test capability_enforcement \
            privileged_drop_survives_execve \
            -- --ignored --exact --nocapture \
            2>&1 | tee artifacts/capability-enforcement/privileged-test.log

      - name: Upload capability enforcement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-enforcement-${{ github.run_id }}
          path: artifacts/capability-enforcement
          if-no-files-found: warn
